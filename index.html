<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyMoney">
<meta name="robots" content="noindex">
<title>MyMoney</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
<header class="top">
  <button id="btn-back" class="icon-btn back-btn" aria-label="Back" title="Back" hidden>‹</button>
  <div class="avatar" id="avatar" hidden></div>
  <div class="top-title">
    <h1 id="screen-title">MyMoney</h1>
    <p id="freshness" class="muted small"></p>
  </div>
  <button id="btn-sync" class="icon-btn" aria-label="Refresh data" title="Refresh">⟳</button>
  <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings" style="font-size:20px">⚙︎</button>
</header>

<div id="banner" class="banner" hidden></div>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Screens">
  <button data-tab="home" class="tab active"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
  <button data-tab="salary" class="tab"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg><span>Salary</span></button>
  <button data-tab="money" class="tab"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 2.6 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/></svg><span>Money</span></button>
  <button data-tab="invest" class="tab"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Invest</span></button>
  <button data-tab="future" class="tab"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Retire</span></button>
  <a href="receipts.html" class="tab"><svg class="ti" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Receipts</span></a>
</nav>

<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js?v=22"></script>
</body>
</html>
